name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── Lint & Type check ────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install tools
        run: python -m pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy server.py

      - name: Run ShellCheck (Bash Linting)
        run: shellcheck tests/test.sh scripts/install-trivy.sh

      - name: Run Hadolint (Dockerfile Linting)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile

  # ── Docker build ────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -t reload-sidecar:ci .

      - name: Check image size
        run: |
          SIZE=$(docker image inspect reload-sidecar:ci --format '{{.Size}}')
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "Image size: ${SIZE_MB} MB"
          if [ "$SIZE_MB" -gt 100 ]; then
            echo "::error::Image too large: ${SIZE_MB} MB (limit: 100 MB)"
            exit 1
          fi
          echo "✅ Image size OK"

      - name: Verify container starts
        run: |
          # start without docker.sock — just ot test that it doesn't crash immediately
          docker run -d --name sidecar-smoke \
            -p 9090:9090 \
            -e TARGET_CONTAINER=dummy \
            reload-sidecar:ci

          sleep 2

          # container should be running (even without docker.sock, just to serve /health)
          STATUS=$(docker inspect --format '{{.State.Running}}' sidecar-smoke)
          if [ "$STATUS" != "true" ]; then
            echo "::error::Container crashed on startup"
            docker logs sidecar-smoke
            exit 1
          fi

          # Health endpoint should respond with status ok (to serve /health)
          RESP=$(curl -s http://localhost:9090/health)
          echo "Health response: $RESP"
          echo "$RESP" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          assert data['status'] == 'ok', f'Unexpected status: {data}'
          print('✅ Health check OK')
          "

          docker rm -f sidecar-smoke

  # ── Integration tests ───────────────────────────────
  integration:
    runs-on: ubuntu-latest
    needs: [lint, build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run integration tests
        run: |
          chmod +x tests/test.sh
          ./tests/test.sh

  # ── Vulnerability scan ──────────────────────────────
  security:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image for scan
        run: docker build -t reload-sidecar:scan .

      - name: Install verified Trivy
        run: bash scripts/install-trivy.sh

      - name: Scan for vulnerabilities
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            reload-sidecar:scan

      # Trivy → SARIF → GitHub Security tab
      - name: Generate SARIF report
        if: always()
        run: |
          trivy image \
            --severity CRITICAL,HIGH,MEDIUM \
            --format sarif \
            --output trivy-results.sarif \
            reload-sidecar:scan

      - name: Upload to GitHub Security
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: always()
        with:
          sarif_file: "trivy-results.sarif"
